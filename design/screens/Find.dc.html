<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nook Find: Answer card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;text-align:inherit;cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:#B4502C}a:hover{color:#8F3F22}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F3EE; color: #2A2420; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 22px">

<div style="display: flex; flex-direction: column; padding: 56px 16px 0">

<h1 style="margin: 0 0 12px; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 34px; line-height: 41px; font-weight: 800">Find</h1>

<label style="height: 48px; padding: 0 2px 0 14px; border-radius: 24px; background: #EFE8DF; display: flex; align-items: center; gap: 8px; margin-bottom: 16px">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: #6A5E55"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
<input type="text" aria-label="Search or ask" value="Where are the passports?" readonly style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; color: inherit; padding: 0">
<button aria-label="Clear search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6A5E55">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
</button>
</label>

<section aria-label="Answer" style="padding: 20px; border-radius: 32px; background: #FFFFFF; border: 1px solid #E4DACE; box-shadow: 0 16px 32px rgba(89,59,33,0.14); display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px">

<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 20px; line-height: 25px; font-weight: 700"><span style="color: #2E6488">Office</span> <span style="color: #8A7E75">→</span> Desk <span style="color: #8A7E75">→</span> Second drawer.</p>
<p style="margin: 0; color: #2A2420">You put them there on Aug 3.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button style="display: flex; flex-direction: column; gap: 4px">
<div style="width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; background: #E9DFD3; color: #9A8B7C; display: flex; align-items: center; justify-content: center">
<svg class="i" width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 1.3"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><circle cx="12" cy="10.5" r="3"/><path d="M9 16.5h6"/></svg>
</div>
<span style="font-size: 13px; line-height: 18px; color: #6A5E55">Passports</span>
</button>
<button style="display: flex; flex-direction: column; gap: 4px">
<div style="width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; background: #E3DACD; color: #9A8B7C; display: flex; align-items: center; justify-content: center">
<svg class="i" width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 1.3"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 12h16M10.5 8.5h3M10.5 15.5h3"/></svg>
</div>
<span style="font-size: 13px; line-height: 18px; color: #6A5E55">Second drawer</span>
</button>
</div>

<div style="display: flex; align-items: center; gap: 5px; font-size: 15px; line-height: 20px; color: #6A5E55">
<svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
Last confirmed Sep 21
</div>

<div style="display: flex; gap: 8px">
<button style="height: 48px; padding: 0 20px; border-radius: 24px; color: #FFFFFF; font-size: 17px; line-height: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; background: {{accent}}">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
Move
</button>
<div style="flex: 1; border-radius: 24px; background: {{accentSoft}}">
<button style="width: 100%; height: 48px; border-radius: 24px; font-size: 16px; line-height: 21px; font-weight: 600; text-align: center; color: {{accent}}">Found it here instead</button>
</div>
</div>

</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 20px; line-height: 25px; font-weight: 700">Also matching</h2>
<div style="height: 64px; padding: 8px; border-radius: 20px; background: #FFFDFA; border: 1px solid #E4DACE; box-shadow: 0 2px 8px rgba(89,59,33,0.06), 0 1px 2px rgba(89,59,33,0.04); display: flex; align-items: center; gap: 12px">
<div style="width: 48px; height: 48px; flex: none; border-radius: 12px; background: #EFE8DF; color: #8A7E75; display: flex; align-items: center; justify-content: center">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="16" height="15" rx="2"/><circle cx="9.5" cy="10" r="2"/><path d="M4.5 17l4.5-3.5 3 2 3.5-4 4 4.5"/></svg>
</div>
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Passport photos</span>
<span style="font-size: 15px; line-height: 20px; color: #6A5E55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: #2E6488">Office</span> → Desk → Top drawer</span>
</div>
<div style="flex: none; border-radius: 22px; background: {{accentSoft}}">
<button aria-label="Move Passport photos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{accent}}">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
</button>
</div>
</div>
</section>

</div>

<button aria-label="Capture" style="position: absolute; right: 16px; bottom: 100px; width: 56px; height: 56px; border-radius: 28px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.35); box-shadow: 0 8px 20px rgba(89,59,33,0.24); background: {{accent}}">
<svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="7.5" y="9.5" width="9" height="6.5" rx="1.5"/><circle cx="12" cy="12.75" r="1.5"/></svg>
</button>

<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 62px; padding: 4px; border-radius: 31px; display: flex; background: rgba(255,253,250,0.74); backdrop-filter: blur(24px) saturate(1.6); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 24px rgba(89,59,33,0.14)">
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; color: #5A5048">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.8V20h13V9.8M10 20v-5.5h4V20"/></svg>
Home
</button>
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; background: rgba(42,36,32,0.07); color: {{accent}}">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
Find
</button>
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; color: #5A5048">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20ZM14 3.5V8h4M9.5 12.5h5M9.5 16h5"/></svg>
Reports
</button>
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; color: #5A5048">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3v2.8M12 18.2V21M3 12h2.8M18.2 12H21M5.6 5.6l2 2M16.4 16.4l2 2M5.6 18.4l2-2M16.4 7.6l2-2"/></svg>
Settings
</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4502C","options":["#B4502C","#4F7A57","#2F6A8F","#8A4A78"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// The user's chosen accent (Terracotta by default).
const accent = this.props.accent ?? '#B4502C';
return {
accent: accent,
// Secondary button fill: the accent at 12% opacity (design system 8.2).
accentSoft: 'color-mix(in srgb, ' + accent + ' 12%, transparent)'
};
}
}
</script>
</body>
</html>
