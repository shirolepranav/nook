<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4502C","options":["#B4502C","#4F7A57","#2F6A8F","#8A4A78"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// The user's chosen accent (Terracotta by default).
const accent = this.props.accent ?? '#B4502C';
// Mixes the accent with transparency, e.g. tint(12) = accent at 12% opacity.
const tint = (percent) => 'color-mix(in srgb, ' + accent + ' ' + percent + '%, transparent)';
return {
accent: accent,
accentSoft: tint(12),   // "suggested" background on cards not yet accepted
accentLine: tint(80),   // detection outline (design system 8.5)
accentFill: tint(15)    // fill of the selected outline
};
}
}
