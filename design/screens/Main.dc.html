<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nook Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;text-align:inherit;cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:#B4502C}a:hover{color:#8F3F22}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F3EE; color: #2A2420; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 22px">

<div style="display: flex; flex-direction: column; gap: 24px; padding: 56px 16px 0">

<header style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 34px; line-height: 41px; font-weight: 800">Maple Street</h1>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column">
<div style="font-size: 15px; line-height: 20px; color: #6A5E55">Total home value</div>
<div style="font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 34px; line-height: 41px; font-weight: 700; font-variant-numeric: tabular-nums">$24,380</div>
</div>
<button aria-label="Hide values" style="width: 44px; height: 44px; border-radius: 22px; background: #EFE8DF; color: #6A5E55; display: flex; align-items: center; justify-content: center">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
</button>
</div>
</header>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 20px; line-height: 25px; font-weight: 700">Rooms</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">

<button style="height: 100px; border-radius: 24px; padding: 14px; background: #F4E9C9; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; justify-content: space-between; color: #7E5F12">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v5a2.5 2.5 0 0 0 5 0v-5M8.5 3.5v17M16 20.5v-17c2.2 1.5 3 4.5 3 8h-3"/></svg>
<span style="font-size: 15px; line-height: 20px; color: #5A5048">48 items</span>
</div>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Kitchen</span>
</button>

<button style="height: 100px; border-radius: 24px; padding: 14px; background: #DCE7DA; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; justify-content: space-between; color: #3F6B48">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11V8.5A2.5 2.5 0 0 1 7.5 6h9A2.5 2.5 0 0 1 19 8.5V11M3.5 13a1.5 1.5 0 0 1 3 0v2h11v-2a1.5 1.5 0 0 1 3 0v4.5h-17ZM6 17.5v2M18 17.5v2"/></svg>
<span style="font-size: 15px; line-height: 20px; color: #5A5048">37 items</span>
</div>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Living room</span>
</button>

<button style="height: 100px; border-radius: 24px; padding: 14px; background: #E5DDEE; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; justify-content: space-between; color: #66508A">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18.5v-6a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v6M3.5 16h17M6 10.5V8a1.5 1.5 0 0 1 1.5-1.5h9A1.5 1.5 0 0 1 18 8v2.5M3.5 18.5V20M20.5 18.5V20"/></svg>
<span style="font-size: 15px; line-height: 20px; color: #5A5048">31 items</span>
</div>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Bedroom</span>
</button>

<button style="height: 100px; border-radius: 24px; padding: 14px; background: #D8E6F0; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; justify-content: space-between; color: #2E6488">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="11" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>
<span style="font-size: 15px; line-height: 20px; color: #5A5048">26 items</span>
</div>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Office</span>
</button>

<button style="height: 100px; border-radius: 24px; padding: 14px; background: #E6E1DA; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; justify-content: space-between; color: #5E554C">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l1.4-4a1.5 1.5 0 0 1 1.4-1h8.4a1.5 1.5 0 0 1 1.4 1L19 11M4 11h16a1 1 0 0 1 1 1v4.5H3V12a1 1 0 0 1 1-1ZM5.5 16.5v2M18.5 16.5v2M7 13.8h.01M17 13.8h.01"/></svg>
<span style="font-size: 15px; line-height: 20px; color: #5A5048">22 items</span>
</div>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Garage</span>
</button>

<button style="height: 100px; border-radius: 24px; padding: 14px; border: 1.5px dashed #C9BBAB; color: #6A5E55; display: flex; flex-direction: column; justify-content: space-between">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Add room</span>
</button>

</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 20px; line-height: 25px; font-weight: 700">Warranties ending soon</h2>
<button style="padding: 12px 0; margin: -12px 0; font-size: 15px; line-height: 20px; font-weight: 600; color: {{accent}}">See all</button>
</div>
<div style="display: flex; gap: 12px; margin-right: -16px; overflow: hidden">

<button style="flex: 0 0 236px; height: 72px; padding: 12px; border-radius: 20px; background: #FFFDFA; border: 1px solid #E4DACE; box-shadow: 0 2px 8px rgba(89,59,33,0.06), 0 1px 2px rgba(89,59,33,0.04); display: flex; align-items: center; gap: 12px">
<div style="width: 48px; height: 48px; flex: none; border-radius: 10px; background: #EFE8DF; color: #8A7E75; display: flex; align-items: center; justify-content: center">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M5 8h14M8.5 5.75h2M9 12h6"/></svg>
</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Dishwasher</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 15px; line-height: 20px; color: #A4610E">
<svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
Ends in 12 days
</span>
</div>
</button>

<button style="flex: 0 0 236px; height: 72px; padding: 12px; border-radius: 20px; background: #FFFDFA; border: 1px solid #E4DACE; box-shadow: 0 2px 8px rgba(89,59,33,0.06), 0 1px 2px rgba(89,59,33,0.04); display: flex; align-items: center; gap: 12px">
<div style="width: 48px; height: 48px; flex: none; border-radius: 10px; background: #EFE8DF; color: #8A7E75; display: flex; align-items: center; justify-content: center">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3.5v3"/></svg>
</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Robot vacuum</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 15px; line-height: 20px; color: #A4610E">
<svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
Ends in 26 days
</span>
</div>
</button>

</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 20px; line-height: 25px; font-weight: 700">Recently added</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">

<button style="padding: 8px; border-radius: 24px; background: #FFFDFA; border: 1px solid #E4DACE; box-shadow: 0 2px 8px rgba(89,59,33,0.06), 0 1px 2px rgba(89,59,33,0.04); display: flex; flex-direction: column; gap: 8px">
<div style="aspect-ratio: 4 / 5; border-radius: 16px; background: #E9DFD3; color: #9A8B7C; display: flex; align-items: center; justify-content: center">
<svg class="i" width="52" height="52" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 1.3"><path d="M4.5 14v-2a7.5 7.5 0 0 1 15 0v2M4.5 14H7v5.5H6A1.5 1.5 0 0 1 4.5 18v-4ZM19.5 14H17v5.5h1a1.5 1.5 0 0 0 1.5-1.5v-4Z"/></svg>
</div>
<div style="display: flex; flex-direction: column; padding: 0 4px 4px">
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Headphones</span>
<span style="font-size: 15px; line-height: 20px; color: #6A5E55">Office → Desk</span>
</div>
</button>

<button style="padding: 8px; border-radius: 24px; background: #FFFDFA; border: 1px solid #E4DACE; box-shadow: 0 2px 8px rgba(89,59,33,0.06), 0 1px 2px rgba(89,59,33,0.04); display: flex; flex-direction: column; gap: 8px">
<div style="aspect-ratio: 4 / 5; border-radius: 16px; background: #E3DACD; color: #9A8B7C; display: flex; align-items: center; justify-content: center">
<svg class="i" width="52" height="52" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 1.3"><path d="M9 3.5h6l3 8H6zM12 11.5V20M8.5 20h7"/></svg>
</div>
<div style="display: flex; flex-direction: column; padding: 0 4px 4px">
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Floor lamp</span>
<span style="font-size: 15px; line-height: 20px; color: #6A5E55">Living room → Reading corner</span>
</div>
</button>

</div>
</section>

</div>

<button aria-label="Capture" style="position: absolute; right: 16px; bottom: 100px; width: 56px; height: 56px; border-radius: 28px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.35); box-shadow: 0 8px 20px rgba(89,59,33,0.24); background: {{accent}}">
<svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="7.5" y="9.5" width="9" height="6.5" rx="1.5"/><circle cx="12" cy="12.75" r="1.5"/></svg>
</button>

<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 62px; padding: 4px; border-radius: 31px; display: flex; background: rgba(255,253,250,0.74); backdrop-filter: blur(24px) saturate(1.6); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 24px rgba(89,59,33,0.14)">
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; background: rgba(42,36,32,0.07); color: {{accent}}">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.8V20h13V9.8M10 20v-5.5h4V20"/></svg>
Home
</button>
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; color: #5A5048">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
Find
</button>
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; color: #5A5048">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20ZM14 3.5V8h4M9.5 12.5h5M9.5 16h5"/></svg>
Reports
</button>
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; color: #5A5048">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3v2.8M12 18.2V21M3 12h2.8M18.2 12H21M5.6 5.6l2 2M16.4 16.4l2 2M5.6 18.4l2-2M16.4 7.6l2-2"/></svg>
Settings
</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4502C","options":["#B4502C","#4F7A57","#2F6A8F","#8A4A78"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// The user's chosen accent (Terracotta by default); tints the Capture button, selected tab and links.
return { accent: this.props.accent ?? '#B4502C' };
}
}
</script>
</body>
</html>
