<div style="width: 7px; height: 7px; border-radius: 4px; background: rgba(42,36,32,0.28)"></div>

<svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
Last confirmed Aug 3
</div>
</div>
<button aria-label="Open spot photo: Counter" style="width: 48px; height: 48px; flex: none; border-radius: 12px; background: #EFE8DF; color: #8A7E75; display: flex; align-items: center; justify-content: center">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10h17M5.5 10v10M18.5 10v10M5.5 15h13M9 6h6v4H9z"/></svg>
</button>

<button style="width: 100%; height: 48px; border-radius: 24px; font-size: 16px; line-height: 21px; font-weight: 600; text-align: center; color: {{accent}}">Found it here instead</button>
</div>
</div>
</section>

<section aria-label="Details" style="border-radius: 24px; background: #FFFDFA; border: 1px solid #E4DACE; box-shadow: 0 2px 8px rgba(89,59,33,0.06), 0 1px 2px rgba(89,59,33,0.04); display: flex; flex-direction: column">
<div style="height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">

<span>Arden</span>
</div>
<div style="height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #E4DACE">

<button aria-label="Serial AR87K0412291, tap to copy" style="height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #E4DACE">

<span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 15px">AR87K…2291</span>
<svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: #6A5E55"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg>
</span>
</button>
<div style="height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #E4DACE">
<span style="color: #6A5E55">Purchased</span>
<span>Mar 14, 2025 · Harbor Home</span>
</div>
</section>

<section aria-label="Warranty" style="padding: 16px; border-radius: 24px; background: #FFFDFA; border: 1px solid #E4DACE; box-shadow: 0 2px 8px rgba(89,59,33,0.06), 0 1px 2px rgba(89,59,33,0.04); display: flex; align-items: center; gap: 12px">

<span style="font-size: 15px; line-height: 20px; color: #6A5E55">Ends Mar 14, 2027</span>

<svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="7.5" y="9.5" width="9" height="6.5" rx="1.5"/><circle cx="12" cy="12.75" r="1.5"/></svg>

Home

Find
</button>
<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; color: #5A5048">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20ZM14 3.5V8h4M9.5 12.5h5M9.5 16h5"/></svg>

<button style="flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 600; color: #5A5048">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3v2.8M12 18.2V21M3 12h2.8M18.2 12H21M5.6 5.6l2 2M16.4 16.4l2 2M5.6 18.4l2-2M16.4 7.6l2-2"/></svg>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4502C","options":["#B4502C","#4F7A57","#2F6A8F","#8A4A78"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// The user's chosen accent (Terracotta by default).
const accent = this.props.accent ?? '#B4502C';
return {
accent: accent,
// Secondary button fill: the accent at 12% opacity (design system 8.2).
accentSoft: 'color-mix(in srgb, ' + accent + ' 12%, transparent)'
};
}
}
</script>
